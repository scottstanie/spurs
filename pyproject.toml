[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spurs"
version = "0.0.3"
description = "Sparse phase unwrapping for InSAR interferograms"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Scott Staniewicz", email = "scott.stanie@utexas.edu" }
]
keywords = ["insar", "phase", "unwrap", "admm", "optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
]

[project.optional-dependencies]
jax = ["jax"]
test = ["pytest", "jax"]
dev = ["pytest", "jax", "ruff", "mypy"]

[project.scripts]
spurs = "spurs.cli:main"

[project.urls]
Homepage = "https://github.com/scottstanie/spurs"
Documentation = "https://scottstanie.github.io/spurs/"
Repository = "https://github.com/scottstanie/spurs"

[tool.hatch.build.targets.wheel]
packages = ["spurs"]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
